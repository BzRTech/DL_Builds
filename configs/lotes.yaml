# Configuração para extração de LOTES (experimental).
# ATENÇÃO: muitos limites de lote são jurídicos/invisíveis na imagem, então a
# extração por DL a partir da foto tende a ser limitada. Usamos segmentação +
# separação por instância (watershed) para tentar dividir, mas o resultado
# esperado é inferior ao de quadras/edificações. O caminho robusto para lotes é
# subdividir as quadras usando edificações + limites visíveis + dado cadastral.

project:
  name: lotes_pilot
  target: lotes
  seed: 42

cities:
  - name: Malta
    image: data/raw/Malta/ortofoto.tif
    labels: data/raw/Malta/lotes_merged.gpkg
    split: train

data_prep:
  processed_dir: data/processed     # COMPARTILHADO: reusa data/processed/Malta.tif
  tiles_dir: data/tiles_lotes
  tile_size: 512
  overlap: 128
  bands: [1, 2, 3]
  min_building_coverage: 0.02
  val_fraction: 0.15

model:
  arch: Unet
  encoder: resnet34
  encoder_weights: imagenet
  in_channels: 3
  classes: 1

train:
  device: cuda
  epochs: 60
  batch_size: 8
  num_workers: 4
  lr: 0.0003
  weight_decay: 0.0001
  amp: true
  early_stop_patience: 12
  dice_weight: 0.5
  out_dir: runs/lotes
  norm_mean: null
  norm_std: null

inference:
  checkpoint: runs/lotes/best.pt
  threshold: 0.5
  window: 512
  overlap: 128
  batch_size: 8
  out_mask_dir: outputs/masks_lotes

postprocess:
  min_area_m2: 50.0
  simplify_tolerance_m: 0.5
  orthogonalize: false
  fill_holes_m2: 10.0
  out_vector: outputs/lotes.gpkg
  instance_separation: true         # lotes precisam ser separados dentro da quadra
  min_peak_distance_px: 45
  instance_tile_px: 4096
  instance_overlap_px: 512

eval:
  iou_thresholds: [0.5]
  report_dir: outputs/eval_lotes
